apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deployment
spec:
  selector:
    matchLabels:
      app: test
  replicas: 1 # Сколько реплик запускать 
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: test
        image: olegtar/testapp
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "50Mi" # Ограничение (лимит) по памяти