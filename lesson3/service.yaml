apiVersion: v1
kind: Service
metadata:
  name: service
spec:
  type: LoadBalancer        # Чтобы сервис был доступен извне кластера
  selector:
    app: blue-deployment           # Должен совпадать с labels из Deployment
  ports:
    - port: 80       # Порт, по которому обращаемся к сервису
      targetPort: 8080    # Порт контейнера (containerPort из Deployment)
      protocol: TCP