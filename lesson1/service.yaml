apiVersion: v1
kind: Service
metadata:
  name: test-service
spec:
  type: NodePort        # Чтобы сервис был доступен извне кластера
  selector:
    app: test           # Должен совпадать с labels из Deployment
  ports:
    - port: 8087        # Порт, по которому обращаемся к сервису
      targetPort: 8080    # Порт контейнера (containerPort из Deployment)
      nodePort: 30087 # Порт на ноде Minikube (диапазон 30000-32767)
      protocol: TCP