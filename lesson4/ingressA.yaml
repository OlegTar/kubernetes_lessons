apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a-version
  annotations:
    nginx.ingress.kubernetes.io/canary: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:               
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:    
                name: a-service
                port:
                  number: 80