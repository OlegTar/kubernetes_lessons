apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: b-version
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Version"
    nginx.ingress.kubernetes.io/canary-by-header-value: "v2"
spec:
  ingressClassName: nginx
  rules:
      - http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: b-service
                    port:
                      number: 80