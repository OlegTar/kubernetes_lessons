apiVersion: v1
kind: Service
metadata:
  name: a-service
spec:
  selector:
    app: a-deployment           # Должен совпадать с labels из Deployment
  ports:
    - port: 80       # Порт, по которому обращаемся к сервису
      targetPort: 8080    # Порт контейнера (containerPort из Deployment)
      protocol: TCP